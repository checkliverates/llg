<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LLG Live Price</title>
  <style>
    body{margin:0;background:#111;color:#fff;font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh}
    .box{text-align:center;padding:28px 36px;border-radius:14px;background:#1c1c1c;box-shadow:0 8px 30px #0008}
    .label{font-size:16px;opacity:.7;margin-bottom:10px}
    .price{font-size:48px;font-weight:700;letter-spacing:.5px}
    .status{font-size:12px;opacity:.5;margin-top:12px}
  </style>
</head>
<body>
  <div class="box">
    <div class="label">LLG</div>
    <div class="price" id="p">----</div>
    <div class="status" id="s">Connecting...</div>
  </div>

<script>
(() => {
  /*
    TEST 1:
    - No WFBullion page is embedded.
    - We connect to the same public Socket.IO quote service used by the website.
    - The markup is deliberately not named "markup" and is lightly obscured.
    - This is NOT secure: a technical user can inspect browser network/JS.
  */

  const _a = [0x30,0x2e,0x35,0x30]; // "0.50"
  const _m = Number(String.fromCharCode(..._a));

  const _u = "https://quote.wfgroup.com.hk:8083/bquote";
  const _c = document.getElementById("p");
  const _s = document.getElementById("s");

  const _script = document.createElement("script");
  _script.src = "https://cdn.jsdelivr.net/npm/socket.io-client@2.5.0/dist/socket.io.js";
  _script.onload = () => {
    const _x = io(_u, {
      transports: ["websocket"],
      reconnection: true,
      reconnectionAttempts: Infinity,
      reconnectionDelay: 1000
    });

    _x.on("connect", () => {
      _s.textContent = "LIVE";
    });

    _x.on("disconnect", () => {
      _s.textContent = "Reconnecting...";
    });

    _x.on("connect_error", () => {
      _s.textContent = "Connection error";
    });

    _x.on("quote.realtime", (data) => {
      try {
        const _v = Number(data?.products?.["XAU="]?.buy);
        if (!Number.isFinite(_v)) return;

        const _final = (_v + _m).toFixed(1);
        _c.textContent = _final;
      } catch (_) {}
    });
  };

  _script.onerror = () => {
    _s.textContent = "Socket library failed";
  };

  document.head.appendChild(_script);
})();
</script>
</body>
</html>
