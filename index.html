<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LLG Live Test</title>

    <!-- Socket.IO 2.x = Engine.IO 3 -->
    <script src="https://cdn.jsdelivr.net/npm/socket.io-client@2.5.0/dist/socket.io.js"></script>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .box {
            width: 350px;
            padding: 35px;
            text-align: center;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.12);
        }

        .title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .status {
            font-size: 18px;
            margin-bottom: 30px;
        }

        .label {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .price {
            font-size: 60px;
            font-weight: bold;
        }

        .time {
            margin-top: 20px;
            font-size: 14px;
            color: #777;
        }

        .error {
            color: red;
        }
    </style>
</head>

<body>

<div class="box">

    <div class="title">
        LLG LIVE TEST
    </div>

    <div id="status" class="status">
        CONNECTING...
    </div>

    <div class="label">
        LLG BID
    </div>

    <div id="price" class="price">
        ---
    </div>

    <div id="time" class="time">
        Waiting for live data...
    </div>

</div>


<script>

// ============================================================
// WFBULLION CONFIG
// ============================================================

const SERVER = "https://quote.wfgroup.com.hk:8083";

const TOKEN = "applepieapplepieapplepieapplepie";


// ============================================================
// CONNECT TO WFBULLION /bquote
// ============================================================

console.log("========================================");
console.log("CONNECTING TO WFBULLION");
console.log("========================================");


const socket = io(
    SERVER + "/bquote",
    {
        transports: ["websocket"],

        query: {
            token: TOKEN
        },

        reconnection: true,

        reconnectionAttempts: Infinity,

        reconnectionDelay: 1000,

        reconnectionDelayMax: 5000,

        timeout: 10000
    }
);


// ============================================================
// CONNECTED
// ============================================================

socket.on("connect", function () {

    console.log("========================================");
    console.log("WEBSOCKET CONNECTED");
    console.log("========================================");

    console.log("Socket ID:", socket.id);

    document.getElementById("status").innerText =
        "CONNECTED";

    document.getElementById("status").className =
        "status";

});


// ============================================================
// LIVE QUOTE
// ============================================================

socket.on("quote.realtime", function (data) {

    console.log("LIVE DATA RECEIVED");


    // Get products
    const products = data && data.products;

    if (!products) {
        console.log("Products not found");
        return;
    }


    // XAU= = LLG
    const llg = products["XAU="];

    if (!llg) {
        console.log("LLG (XAU=) not found");
        return;
    }


    // buy = BID
    const bid = parseFloat(llg.buy);

    if (isNaN(bid)) {
        console.log("Invalid BID:", llg.buy);
        return;
    }


    // ========================================================
    // DISPLAY BID
    // ========================================================

    document.getElementById("price").innerText =
        bid.toFixed(1);


    document.getElementById("time").innerText =
        "LIVE • " + new Date().toLocaleTimeString();


    // ========================================================
    // CONSOLE
    // ========================================================

    console.log("----------------------------------------");
    console.log("LLG BID :", bid);
    console.log("LLG ASK :", llg.sell);
    console.log("TIME    :", new Date().toLocaleTimeString());
    console.log("----------------------------------------");

});


// ============================================================
// DISCONNECT
// ============================================================

socket.on("disconnect", function (reason) {

    console.log("DISCONNECTED:", reason);

    document.getElementById("status").innerText =
        "RECONNECTING...";

});


// ============================================================
// CONNECT ERROR
// ============================================================

socket.on("connect_error", function (error) {

    console.error(
        "CONNECTION ERROR:",
        error
    );

    document.getElementById("status").innerText =
        "CONNECTION ERROR";

    document.getElementById("status").className =
        "status error";

});


// ============================================================
// RECONNECTING
// ============================================================

socket.on("reconnecting", function (attempt) {

    console.log(
        "RECONNECTING... Attempt:",
        attempt
    );

    document.getElementById("status").innerText =
        "RECONNECTING...";

});


// ============================================================
// RECONNECTED
// ============================================================

socket.on("reconnect", function (attempt) {

    console.log(
        "RECONNECTED",
        "Attempt:",
        attempt
    );

    document.getElementById("status").innerText =
        "CONNECTED";

});


// ============================================================
// RECONNECT ERROR
// ============================================================

socket.on("reconnect_error", function (error) {

    console.error(
        "RECONNECT ERROR:",
        error
    );

});

</script>

</body>
</html>
