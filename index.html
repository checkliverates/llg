<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLG Live Test</title>

<script src="https://cdn.jsdelivr.net/npm/socket.io-client@2.5.0/dist/socket.io.js"></script>

<style>
body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;background:#f5f5f5;font-family:Arial,sans-serif}
.box{width:350px;padding:35px;text-align:center;background:white;border-radius:15px;box-shadow:0 5px 25px rgba(0,0,0,.12)}
.title{font-size:24px;font-weight:bold;margin-bottom:25px}
.status{font-size:18px;margin-bottom:30px}
.label{font-size:18px;margin-bottom:10px}
.price{font-size:60px;font-weight:bold}
.time{margin-top:20px;font-size:14px;color:#777}
.error{color:red}
</style>
</head>

<body>
<div class="box">
  <div class="title">LLG LIVE TEST</div>
  <div id="status" class="status">CONNECTING...</div>
  <div class="label">LLG PRICE</div>
  <div id="price" class="price">---</div>
  <div id="time" class="time">Waiting for live data...</div>
</div>

<script>
(() => {
  /*
    CORRECT TEST 1
    Based directly on the previously working Socket.IO connection.

    Test markup: +0.50
    This is only obscured, NOT secure.
  */

  // "0.50" is reconstructed instead of written as a normal markup variable.
  const _d = [48,46,53,48];
  const _x = Number(String.fromCharCode(..._d));

  // Same server/namespace structure as the working code.
  const _s = "https://quote.wfgroup.com.hk:8083";
  const _t = "applepieapplepieapplepieapplepie";

  const _socket = io(_s + "/bquote", {
    transports: ["websocket"],
    query: { token: _t },
    reconnection: true,
    reconnectionAttempts: Infinity,
    reconnectionDelay: 1000,
    reconnectionDelayMax: 5000,
    timeout: 10000
  });

  const _p = document.getElementById("price");
  const _st = document.getElementById("status");
  const _tm = document.getElementById("time");

  _socket.on("connect", () => {
    _st.innerText = "CONNECTED";
    _st.className = "status";
  });

  _socket.on("quote.realtime", (data) => {
    try {
      const _q = data && data.products && data.products["XAU="];
      if (!_q) return;

      const _b = parseFloat(_q.buy);
      if (isNaN(_b)) return;

      // Customer-facing price = BID + hidden test difference.
      _p.innerText = (_b + _x).toFixed(1);
      _tm.innerText = "LIVE • " + new Date().toLocaleTimeString();
    } catch (_) {}
  });

  _socket.on("disconnect", () => {
    _st.innerText = "RECONNECTING...";
    _st.className = "status";
  });

  _socket.on("connect_error", () => {
    _st.innerText = "CONNECTION ERROR";
    _st.className = "status error";
  });

  _socket.on("reconnect", () => {
    _st.innerText = "CONNECTED";
    _st.className = "status";
  });
})();
</script>
</body>
</html>
