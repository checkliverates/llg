<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Prices</title>

<script src="https://cdn.jsdelivr.net/npm/socket.io-client@2.5.0/dist/socket.io.js"></script>

<style>
body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#f5f5f5;
  font-family:Arial,sans-serif
}

.box{
  width:350px;
  padding:35px;
  text-align:center;
  background:white;
  border-radius:15px;
  box-shadow:0 5px 25px rgba(0,0,0,.12)
}

.title{
  font-size:24px;
  font-weight:bold;
  margin-bottom:25px
}

.status{
  font-size:18px;
  margin-bottom:30px
}

.label{
  font-size:18px;
  margin-bottom:10px
}

.price{
  font-size:60px;
  font-weight:bold
}

.small-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:22px;
  font-weight:bold;
  padding:8px 5px
}

.small-row span:last-child{
  font-size:30px
}

.time{
  margin-top:20px;
  font-size:14px;
  color:#777
}

.error{
  color:red
}
</style>

</head>

<body>

<div class="box">

  <div class="title">LIVE PRICES</div>

  <div id="status" class="status">CONNECTING...</div>

  <div class="label">XAU</div>

  <div class="small-row">
    <span>Bid</span>
    <span id="xauBid">---</span>
  </div>

  <div class="small-row">
    <span>Ask</span>
    <span id="xauAsk">---</span>
  </div>

  <div class="label" style="margin-top:25px">
    P1kKGG
  </div>

  <div class="small-row">
    <span>Bid</span>
    <span id="p1Bid">---</span>
  </div>

  <div class="small-row">
    <span>Ask</span>
    <span id="p1Ask">---</span>
  </div>

  <div id="time" class="time">
    Waiting for live data...
  </div>

</div>

<script>
(() => {

  /*
  ============================================================
  MARKUP
  ============================================================
  P1kKGG ke liye +0.30
  */

  const _d = [48,46,51,48];
  const _x = Number(String.fromCharCode(..._d));


  /*
  ============================================================
  SOCKET SERVER
  ============================================================
  */

  const _s = "https://quote.wfgroup.com.hk:8083";

  const _t = "applepieapplepieapplepieapplepie";


  /*
  ============================================================
  SOCKET CONNECTION
  ============================================================
  */

  const _socket = io(_s + "/bquote", {

    transports: ["websocket"],

    query: {
      token: _t
    },

    reconnection: true,

    reconnectionAttempts: Infinity,

    reconnectionDelay: 1000,

    reconnectionDelayMax: 5000,

    timeout: 10000

  });


  /*
  ============================================================
  HTML ELEMENTS
  ============================================================
  */

  const _xb = document.getElementById("xauBid");

  const _xa = document.getElementById("xauAsk");

  const _pb = document.getElementById("p1Bid");

  const _pa = document.getElementById("p1Ask");

  const _st = document.getElementById("status");

  const _tm = document.getElementById("time");


  /*
  ============================================================
  CONNECTED
  ============================================================
  */

  _socket.on("connect", () => {

    _st.innerText = "CONNECTED";

    _st.className = "status";

  });


  /*
  ============================================================
  REALTIME PRICE DATA
  ============================================================
  */

  _socket.on("quote.realtime", (data) => {

    try {

      const _products = data && data.products;

      if (!_products) {
        return;
      }


      /*
      ==========================================================
      XAU
      ==========================================================
      ORIGINAL LOGIC - NO CHANGE
      ==========================================================
      */

      const _xau = _products["XAU="];

      if (_xau) {

        const _xbv = parseFloat(_xau.buy);

        const _xav = parseFloat(_xau.sell);


        if (!isNaN(_xbv)) {

          _xb.innerText = _xbv.toFixed(1);

        }


        if (!isNaN(_xav)) {

          _xa.innerText = _xav.toFixed(1);

        }

      }


      /*
      ==========================================================
      P1kKGG
      ==========================================================
      FIND METHOD 1:
      Direct key

      FIND METHOD 2:
      Object ke andar id === "P1kKGG"
      ==========================================================
      */

      let _p1 = _products["P1kKGG"];


      if (!_p1) {

        const _productList = Object.values(_products);

        _p1 = _productList.find(

          p => p && p.id === "P1kKGG"

        );

      }


      /*
      ==========================================================
      P1kKGG PRICE CALCULATION
      ==========================================================
      
      Example BUY:

      139188
      ↓
      last digit remove
      ↓
      13918
      ↓
      /100
      ↓
      139.18
      ↓
      +0.30
      ↓
      139.48


      Example SELL:

      139358
      ↓
      last digit remove
      ↓
      13935
      ↓
      /100
      ↓
      139.35
      ↓
      +0.30
      ↓
      139.65

      ==========================================================
      */


      if (_p1) {

        const _pbv = parseFloat(_p1.buy);

        const _pav = parseFloat(_p1.sell);


        /*
        ========================================================
        P1kKGG BID
        ========================================================
        */

        if (!isNaN(_pbv)) {

          const _finalBid =
            Math.floor(_pbv / 10) / 100 + _x;

          _pb.innerText = _finalBid.toFixed(2);

        }


        /*
        ========================================================
        P1kKGG ASK
        ========================================================
        */

        if (!isNaN(_pav)) {

          const _finalAsk =
            Math.floor(_pav / 10) / 100 + _x;

          _pa.innerText = _finalAsk.toFixed(2);

        }

      }


      /*
      ==========================================================
      LIVE TIME
      ==========================================================
      */

      _tm.innerText =
        "LIVE • " +
        new Date().toLocaleTimeString();


    } catch (_) {

      /*
      Ignore individual realtime message errors
      */

    }

  });


  /*
  ============================================================
  DISCONNECT
  ============================================================
  */

  _socket.on("disconnect", () => {

    _st.innerText = "RECONNECTING...";

    _st.className = "status";

  });


  /*
  ============================================================
  CONNECTION ERROR
  ============================================================
  */

  _socket.on("connect_error", () => {

    _st.innerText = "CONNECTION ERROR";

    _st.className = "status error";

  });


  /*
  ============================================================
  RECONNECTED
  ============================================================
  */

  _socket.on("reconnect", () => {

    _st.innerText = "CONNECTED";

    _st.className = "status";

  });


})();
</script>

</body>
</html>
